version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: armorauth-mysql
    environment:
      MYSQL_ROOT_PASSWORD: armorauth_root
      MYSQL_DATABASE: identity_server
      MYSQL_USER: armorauth
      MYSQL_PASSWORD: armorauth
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: armorauth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  armorauth-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: armorauth-server
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/identity_server?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: armorauth
      SPRING_DATASOURCE_PASSWORD: armorauth
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
