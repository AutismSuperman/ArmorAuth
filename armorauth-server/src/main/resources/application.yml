server:
  port: 9000
  servlet:
    session:
      tracking-modes: cookie
spring:
  profiles:
    active: mysql
  application:
    name: armorauth-server
  jpa:
    show-sql: true
    generate-ddl: true
    open-in-view: false
    database: mysql
    hibernate:
      ddl-auto: update

armorauth:
  federation:
    default-login-mode: confirm
