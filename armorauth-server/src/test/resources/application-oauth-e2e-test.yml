spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration
      - org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:armorauth_oauth_e2e;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,AUTHORIZATION
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration-h2,classpath:db/migration,classpath:db/oauth-e2e
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    show-sql: false
    generate-ddl: false
    open-in-view: false
    database: h2
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none

armorauth:
  authorization-server:
    multiple-issuers:
      enabled: true
    dynamic-client-registration:
      enabled: true
  federation:
    enabled: false
    default-login-mode: confirm

logging:
  level:
    org.hibernate.SQL: warn
